<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GRAND MOBILE · Support Copilot</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#">
      <span class="logo">G</span>
      <span class="brand-text">GRAND<span class="brand-small">MOBILE · RP</span></span>
    </a>
    <div class="workspace">РАБОЧЕЕ ПРОСТРАНСТВО</div>
    <nav aria-label="Основная навигация">
      <button class="nav active" data-view="queue" aria-label="Обращения">▦ <span>Обращения</span><b id="navcount">0</b></button>
      <button class="nav" data-view="rules" aria-label="База знаний">▤ <span>База знаний</span></button>
      <button class="nav" data-view="history" aria-label="История действий">↺ <span>История действий</span></button>
    </nav>
    <div class="side-bottom">
      <div class="system">
        <i></i> Copilot активен
        <span>AI-триаж · RAG 11 разделов</span>
      </div>
      <div class="profile">
        <span class="avatar">GM</span>
        <div>Grand Mobile<small>Support Copilot</small></div>
        <span>⌄</span>
      </div>
    </div>
  </aside>
  <main>
    <header>
      <div class="breadcrumb">GRAND MOBILE <span>/</span> ПОДДЕРЖКА<span class="breadcrumb-context"> ИГРОКОВ</span></div>
      <div class="header-right">
        <span class="demo">RAG · локальный режим</span>
        <span class="date">30 октября 2026</span>
      </div>
    </header>
    <div id="app"></div>
  </main>
  <div id="toast" role="status"></div>
  <dialog id="modal">
    <div id="modal-body"></div>
    <button id="close-modal" class="secondary">Закрыть</button>
  </dialog>
  <script src="workspace.js"></script>
</body>
</html>

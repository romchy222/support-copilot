ans-serif" font-size="16" font-weight="800" fill="#94a3b8">0</text><text x="447" y="118" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e8eefc">p3</text><text x="218" y="351" text-anchor="end" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e8eefc">p3 низкий</text><rect x="230" y="316" width="58" height="58" rx="10" fill="#121a2b" fill-opacity="1"/><text x="259" y="351" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#94a3b8">0</text><rect x="292" y="316" width="58" height="58" rx="10" fill="#121a2b" fill-opacity="1"/><text x="321" y="351" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#94a3b8">0</text><rect x="354" y="316" width="58" height="58" rx="10" fill="#121a2b" fill-opacity="1"/><text x="383" y="351" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#94a3b8">0</text><rect x="416" y="316" width="58" height="58" rx="10" fill="#ff7a00" fill-opacity="0.5982142857142857"/><text x="445" y="351" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#fff">13</text><text x="520" y="136" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#e8eefc">Контрольная выборка: 45 обращений</text><text x="520" y="162" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Accuracy категории: 44 / 45 = 97,8%</text><text x="520" y="184" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Macro-F1 по приоритету: 0,75</text><text x="520" y="206" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">(1,000 по трём присутствующим классам;</text><text x="520" y="224" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8"> класс p0 в выборке отсутствует и даёт 0)</text><text x="520" y="260" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#ffb800">Разметил ассистент, не человек: это</text><text x="520" y="278" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#ffb800">контроль регрессий, а не независимая оценка.</text>

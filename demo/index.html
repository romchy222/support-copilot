<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Copilot — независимое демо</title><style>*{box-sizing:border-box}body{font:15px/1.6 system-ui;margin:0;background:#f4f6f8;color:#243144}header{background:#17212d;color:white;padding:28px max(20px,calc((100vw - 1150px)/2))}h1{font-size:30px;margin:0}header p{color:#b8c4d2;margin:8px 0}main{max-width:1150px;margin:28px auto;padding:0 20px}.notice{padding:14px 18px;background:#fff5e7;border:1px solid #efdbc0;border-radius:8px;margin-bottom:22px}.desk{display:grid;grid-template-columns:320px 1fr;background:white;border:1px solid #e0e5ec;border-radius:10px;overflow:hidden}nav{background:#fafbfc;border-right:1px solid #e0e5ec}button,input,textarea{font:inherit}nav button{width:100%;padding:20px;text-align:left;background:none;border:0;border-bottom:1px solid #e0e5ec;cursor:pointer}nav button.active{background:#fff1e6;border-left:3px solid #e97831}small{display:block;color:#7b899a}article{padding:28px}h2{margin:0 0 12px}blockquote{margin:0;padding:18px;background:#f4f7fb;border-radius:7px}textarea{width:100%;min-height:130px;border:1px solid #d8dfe8;border-radius:6px;padding:15px;margin-top:10px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button{padding:10px 15px;border:1px solid #d5dde6;background:white;border-radius:6px;cursor:pointer}.actions button:first-child{background:#e97831;color:white;border-color:#e97831}.pill{font-size:12px;color:#a15e22;background:#fff2dc;padding:4px 8px;border-radius:4px}#status{margin-top:15px;color:#36735c}@media(max-width:700px){.desk{grid-template-columns:1fr}nav{border-right:0}article{padding:20px}h1{font-size:24px}}</style><header><h1>Support Copilot</h1><p>Рабочее место поддержки · независимое учебное демо</p></header><main><div class="notice">Все обращения и ответы написаны специально для демонстрации. Данные хакатона, игровые правила, реальные игроки и внешняя модель здесь отсутствуют. Действия сохраняются только до закрытия страницы.</div><div class="desk"><nav id="queue" aria-label="Учебные обращения"></nav><article id="detail"></article></div></main><script type="module">
const tickets=[{id:'DEMO-01',title:'Нужна помощь',language:'RU',text:'Учебный персонаж не может выйти из тренировочной комнаты.',reply:'Здравствуйте! Уточните название тренировочной комнаты и что происходит при попытке выйти. Эти сведения помогут специалисту разобраться.'},{id:'DEMO-02',title:'Төлем туралы сұрақ',language:'KK',text:'Бұл оқу мысалы. Демо дүкендегі сатып алу көрінбейді.',reply:'Сәлеметсіз бе! Оқу мысалын тексеру үшін сатып алу атауы мен уақытын нақтылаңыз. Құпия деректерді жібермеңіз.'},{id:'DEMO-03',title:'Savol',language:'UZ',text:'Bu o‘quv misoli. Demo xonasini qanday topaman?',reply:'Salom! Qaysi demo xonasi kerakligini aniqlashtiring. Bu ma’lumot mutaxassisga yordam beradi.'}];let selected=0;const queue=document.querySelector('#queue'),detail=document.querySelector('#detail');function el(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n}function render(){queue.replaceChildren();tickets.forEach((t,i)=>{const b=el('button',undefined,queue);b.className=i===selected?'active':'';el('b',t.title,b);el('small',t.id+' · '+t.language,b);b.onclick=()=>{selected=i;render()}});detail.replaceChildren();const t=tickets[selected];el('span','Нужна проверка человеком',detail).className='pill';el('h2',t.title,detail);el('blockquote',t.text,detail);const label=el('label','Черновик ответа',detail),draft=el('textarea',undefined,label);draft.value=t.reply;draft.oninput=()=>t.reply=draft.value;const actions=el('div',undefined,detail);actions.className='actions';const approve=el('button','Подтвердить в демо',actions),save=el('button','Сохранить правки',actions),escalate=el('button','Передать специалисту',actions),status=el('p',t.status||'',detail);status.id='status';for(const [button,message] of [[approve,'Учебный ответ подтверждён. Реальной отправки нет.'],[save,'Правки сохранены в памяти страницы.'],[escalate,'Учебная передача отмечена. Внешнее уведомление не отправлялось.']])button.onclick=()=>{t.reply=draft.value;t.status=message;status.textContent=message}}render();
</script></html>

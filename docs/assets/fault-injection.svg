<line x1="736.2142857142858" y1="76" x2="736.2142857142858" y2="254" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/><text x="742.2142857142858" y="72" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ef4444">Порог 5000 мс</text><text x="28" y="101" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Зависание хранилища</text><rect x="288" y="88" width="502" height="18" rx="9" fill="#121a2b"/><rect x="288" y="88" width="76.19642857142857" height="18" rx="9" fill="url(#g-bl)"/><text x="802" y="102" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">850 мс</text><text x="28" y="135" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Зависание дедупликации</text><rect x="288" y="122" width="502" height="18" rx="9" fill="#121a2b"/><rect x="288" y="122" width="24.4725" height="18" rx="9" fill="url(#g-bl)"/><text x="802" y="136" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">273 мс</text><text x="28" y="169" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Зависание модели</text><rect x="288" y="156" width="502" height="18" rx="9" fill="#121a2b"/><rect x="288" y="156" width="224.28642857142856" height="18" rx="9" fill="url(#g-or)"/><text x="802" y="170" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">2502 мс</text><text x="28" y="203" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Квота модели исчерпана</text><rect x="288" y="190" width="502" height="18" rx="9" fill="#121a2b"/><rect x="288" y="190" width="3" height="18" rx="9" fill="url(#g-bl)"/><text x="802" y="204" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">10 мс</text><text x="28" y="237" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Ошибка хранилища</text><rect x="288" y="224" width="502" height="18" rx="9" fill="#121a2b"/><rect x="288" y="224" width="3" height="18" rx="9" fill="url(#g-bl)"/><text x="802" y="238" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">4 мс</text><text x="28" y="282" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#94a3b8">Синтетическая инъекция через тот же оркестратор, не реальный отказ провайдера или хранилища.</text>

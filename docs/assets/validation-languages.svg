<text x="28" y="101" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Русский (ru)</text><rect x="258" y="88" width="452" height="18" rx="9" fill="#121a2b"/><rect x="258" y="88" width="436.745" height="18" rx="9" fill="url(#g-or)"/><text x="722" y="102" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">773<tspan fill="#94a3b8" font-weight="500" font-size="11.5"> 77.3%</tspan></text><text x="28" y="135" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Узбекский (uz)</text><rect x="258" y="122" width="452" height="18" rx="9" fill="#121a2b"/><rect x="258" y="122" width="64.41" height="18" rx="9" fill="url(#g-bl)"/><text x="722" y="136" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">114<tspan fill="#94a3b8" font-weight="500" font-size="11.5"> 11.4%</tspan></text><text x="28" y="169" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Не определён (und)</text><rect x="258" y="156" width="452" height="18" rx="9" fill="#121a2b"/><rect x="258" y="156" width="44.07" height="18" rx="9" fill="url(#g-or)"/><text x="722" y="170" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">78<tspan fill="#94a3b8" font-weight="500" font-size="11.5"> 7.8%</tspan></text><text x="28" y="203" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Казахский (kk)</text><rect x="258" y="190" width="452" height="18" rx="9" fill="#121a2b"/><rect x="258" y="190" width="18.080000000000002" height="18" rx="9" fill="url(#g-bl)"/><text x="722" y="204" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">32<tspan fill="#94a3b8" font-weight="500" font-size="11.5"> 3.2%</tspan></text><text x="28" y="237" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Английский (en)</text><rect x="258" y="224" width="452" height="18" rx="9" fill="#121a2b"/><rect x="258" y="224" width="3" height="18" rx="9" fill="url(#g-or)"/><text x="722" y="238" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">3<tspan fill="#94a3b8" font-weight="500" font-size="11.5"> 0.3%</tspan></text><text x="28" y="282" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#94a3b8">Только агрегированные счётчики; тексты обращений в репозиторий не включаются.</text>

<line x1="740.5" y1="76" x2="740.5" y2="254" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/><text x="746.5" y="72" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ef4444">Порог 5000 мс</text><text x="28" y="101" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Офлайн конвейер, p95</text><rect x="328" y="88" width="462" height="18" rx="9" fill="#121a2b"/><rect x="328" y="88" width="3" height="18" rx="9" fill="url(#g-gr)"/><text x="802" y="102" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">0,58 мс</text><text x="28" y="135" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Локальный HTTP /triage, p50</text><rect x="328" y="122" width="462" height="18" rx="9" fill="#121a2b"/><rect x="328" y="122" width="18.645" height="18" rx="9" fill="url(#g-gr)"/><text x="802" y="136" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">226 мс</text><text x="28" y="169" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Локальный HTTP /triage, p95</text><rect x="328" y="156" width="462" height="18" rx="9" fill="#121a2b"/><rect x="328" y="156" width="25.41" height="18" rx="9" fill="url(#g-gr)"/><text x="802" y="170" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">308 мс</text><text x="28" y="203" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Живая LLM, 8 синтетических, макс.</text><rect x="328" y="190" width="462" height="18" rx="9" fill="#121a2b"/><rect x="328" y="190" width="150.39749999999998" height="18" rx="9" fill="url(#g-bl)"/><text x="802" y="204" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">1823 мс</text><text x="28" y="237" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Опубликованный сайт, p95 (LLM таймаут)</text><rect x="328" y="224" width="462" height="18" rx="9" fill="#121a2b"/><rect x="328" y="224" width="379.2525" height="18" rx="9" fill="url(#g-or)"/><text x="802" y="238" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">4597 мс</text><text x="28" y="282" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#94a3b8">Зелёный — без внешней модели, синий — с живой моделью, оранжевый — внешняя модель недоступна, сработали таймауты.</text>

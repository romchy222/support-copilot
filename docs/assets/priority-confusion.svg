<text x="28" y="40" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#e8eefc">Матрица приоритетов на контрольной выборке</text>
<text x="28" y="62" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Строки — эталон, столбцы — предсказание. Диагональ — совпадения.</text>
<text x="354" y="92" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#94a3b8">Предсказано сервисом</text><text transform="translate(60 254) rotate(-90)" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#94a3b8">Эталон (саморазметка)</text><text x="261" y="118" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e8eefc">p0</text><text x="218" y="165" text-anchor="end" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e8eefc">p0 критично</text><rect x="230" y="130" width="58" height="58" rx="10" fill="#121a2b" fill-opacity="1"/><text x="259" y="165" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#94a3b8">0</text><rect x="292" y="130" width="58" height="58" rx="10" fill="#121a2b" fill-opacity="1"/><text x="321" y="165" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#94a3b8">0</text><rect x="354" y="130" width="58" height="58" rx="10" fill="#121a2b" fill-opacity="1"/><text x="383" y="165" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#94a3b8">0</text><rect x="416" y="130" width="58" height="58" rx="10" fill="#121a2b" fill-opacity="1"/><text x="445" y="165" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#94a3b8">0</text><text x="323" y="118" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e8eefc">p1</text><text x="218" y="227" text-anchor="end" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e8eefc">p1 высокий</text><rect x="230" y="192" width="58" height="58" rx="10" fill="#121a2b" fill-opacity="1"/><text x="259" y="227" text-anchor="midd
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 266" width="940" height="266" role="img" aria-label="Стоимость обработки одного обращения, USD">
<defs>
  <linearGradient id="g-or" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb800"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
  <linearGradient id="g-bl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#22a0ee"/></linearGradient>
  <linearGradient id="g-gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient>
</defs>
<rect width="940" height="266" rx="16" fill="#0b101b"/>
<rect x="0.5" y="0.5" width="939" height="265" rx="16" fill="none" stroke="#243049"/>
<rect x="0" y="0" width="940" height="4" rx="2" fill="url(#g-or)"/>
<text x="28" y="40" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#e8eefc">Стоимость обработки одного обращения, USD</text>
<text x="28" y="62" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Лимит ТЗ: ≤ 0,002 USD за обращение либо локальная модель. Расчёт по тарифам от 30.10.2026.</text>
<text x="28" y="101" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Лимит ТЗ</text><rect x="328" y="88" width="482" height="18" rx="9" fill="#121a2b"/><rect x="328" y="88" width="438.1818181818182" height="18" rx="9" fill="url(#g-or)"/><text x="822" y="102" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">0,002000</text><text x="28" y="135" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Максимум из 8 живых вызовов</text><rect x="328" y="122" width="482" height="18" rx="9" fill="#121a2b"/><rect x="328" y="122" width="137.69863636363638" height="18" rx="9" fill="url(#g-bl)"/><text x="822" y="136" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">0,000629</text><text x="28" y="169" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Среднее по 8 живым вызовам</text><rect x="328" y="156" width="482" height="18" rx="9" fill="#121a2b"/><rect x="328" y="156" width="114.21482954545453" height="18" rx="9" fill="url(#g-bl)"/><text x="822" y="170" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">0,000521</text><text x="28" y="203" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#e8eefc">Локальный режим (без внешней модели)</text><rect x="328" y="190" width="482" height="18" rx="9" fill="#121a2b"/><rect x="328" y="190" width="3" height="18" rx="9" fill="url(#g-gr)"/><text x="822" y="204" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#e8eefc">0,000000</text><text x="28" y="248" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#94a3b8">Среднее ≈ 0,521 · 10⁻³ USD, то есть примерно в 3,8 раза ниже лимита. Это оценка стандартной платной стоимости, не счёт провайдера.</text>

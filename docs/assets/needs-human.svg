<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Доля обращений, переданных человеку (валидация, 1000)">
<defs>
  <linearGradient id="g-or" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb800"/><stop offset="1" stop-color="#ff7a00"/></linearGradient>
  <linearGradient id="g-bl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#22a0ee"/></linearGradient>
  <linearGradient id="g-gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient>
</defs>
<rect width="860" height="330" rx="16" fill="#0b101b"/>
<rect x="0.5" y="0.5" width="859" height="329" rx="16" fill="none" stroke="#243049"/>
<rect x="0" y="0" width="860" height="4" rx="2" fill="url(#g-or)"/>
<text x="28" y="40" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#e8eefc">Доля обращений, переданных человеку (валидация, 1000)</text>
<text x="28" y="62" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Сервис честно говорит, когда нужен человек, а не имитирует уверенность.</text>
<circle cx="190" cy="190" r="90" fill="none" stroke="#121a2b" stroke-width="34"/><circle cx="190" cy="190" r="90" fill="none" stroke="#ff7a00" stroke-width="34" stroke-dasharray="531.557476987393 33.92920065876979" transform="rotate(-90 190 190)" stroke-linecap="butt"/><circle cx="190" cy="190" r="90" fill="none" stroke="#10b981" stroke-width="34" stroke-dasharray="33.92920065876979 531.557476987393" stroke-dashoffset="-531.557476987393" transform="rotate(-90 190 190)"/><text x="190" y="188" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#e8eefc">94%</text><text x="190" y="210" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8">needs_human</text><rect x="360" y="100" width="14" height="14" rx="4" fill="#ff7a00"/><text x="386" y="112" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#e8eefc">Нужен человек — 940 из 1000</text><text x="386" y="132" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Все жалобы, платежи, аккаунты, апелляции, спорные случаи.</text><rect x="360" y="168" width="14" height="14" rx="4" fill="#10b981"/><text x="386" y="180" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#e8eefc">Автоответ допустим политикой — 60</text><text x="386" y="200" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Оффтоп и вопросы механики при уверенности ≥ 0,85 и с источником.</text><text x="360" y="262" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Высокая доля — осознанный выбор: ТЗ требует отправлять платежи, апелляции и</text><text x="360" y="281" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#94a3b8">взломы человеку, а решение о наказании всегда подтверждает администратор.</text>
</svg>
